# Atajos directos

# Desvincular bindings existentes del sistema


set $term2 alacritty
set $browser flatpak run com.vivaldi.Vivaldi
set $filemanager flatpak run org.kde.dolphin
set $vscode flatpak run com.vscodium.codium 

bindsym $mod+Shift+t exec $term2
bindsym $mod+Shift+b exec $browser
bindsym $mod+Shift+f exec $filemanager
bindsym $mod+Shift+v exec $vscode
#bindsym $mod+d exec wofi --show drun

# Ciclar entre división horizontal, vertical y pestañas
unbindsym $mod+s
bindsym $mod+s layout toggle splith splitv tabbed

